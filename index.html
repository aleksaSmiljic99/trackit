<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f2f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191715" media="(prefers-color-scheme: dark)" />
    <title>TrackIt</title>
    <script>
      // Apply a saved explicit theme before first paint to avoid a flash.
      // "system" users need nothing here — the CSS media query handles them.
      try {
        var t = JSON.parse(localStorage.getItem('trackit.prefs') || '{}').theme
        if (t === 'light' || t === 'dark')
          document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
